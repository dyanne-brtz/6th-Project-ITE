<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift for Ma'am Mari 🎁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="style.css">
</head>
<body class="teachers-page">

    <div style="position: fixed; top: 25px; right: 25px; z-index: 999;">

                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>

                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <div class="card letter-card" style="text-align: center; padding: 50px 20px;">
        
        <h3 style="font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: #c94b68; margin-bottom: 20px;">Surprise! 🎁</h3>
        
        <div class="polaroid" style="transform: rotate(0); margin: 0 auto 30px auto;">
            <img src="group.jpg" alt="Our Class with Ma'am" style="width: 100%; max-width: 400px;">
        </div>
        
        <p class="photo-caption" style="font-family: 'Dancing Script', cursive; font-size: 1.5rem; color: #e8a0b0;">
            A memory from your students 💗
        </p>

        <div style="margin-top: 40px;">
            <a href="index.html" class="open-btn" style="text-decoration: none; display: inline-block;">
                ← Back to the Start
            </a>

    <script src="theme.js"></script>
